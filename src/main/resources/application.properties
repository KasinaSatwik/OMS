# MySQL datasource - adjust URL/credentials as needed
spring.datasource.url=jdbc:mysql://localhost:3306/omsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=app_user
spring.datasource.password=app_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Task executor pool
oms.threadpool.core=4
spring.application.name=oms
